# ROI name → canonical (approach, movement) mapping.
# Seeded from camera_mapping.json; extend as EdgeAgent ROI names evolve.
#
# For cameras using the standard NB/SB/EB/WB naming convention,
# the regex auto-resolver handles it — only non-standard names need entries here.

