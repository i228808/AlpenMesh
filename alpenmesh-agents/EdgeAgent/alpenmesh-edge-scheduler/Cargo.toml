[package]
name = "alpenmesh-scheduler"
version = "0.1.0"
edition = "2024"

# Standalone workspace so this crate works when created inside another repo (e.g. Oxide itself).
[workspace]

[dependencies]
oxide-framework-core = "0.1.0"
axum = { version = "0.8", features = ["multipart"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
chrono = { version = "0.4.38", features = ["serde"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
mongodb = "3"
solana-rpc-client = "2.2.20"
solana-commitment-config = "2.2.1"
solana-instruction = "2.3.3"
solana-message = "2.4.0"
solana-pubkey = "2.4.0"
solana-keypair = "2.2.3"
solana-signature = "2.3.0"
solana-signer = "2.2.1"
solana-transaction = "2.2.3"
solana-native-token = "2.3.0"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
dotenvy = "0.15"
